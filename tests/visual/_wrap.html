<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:'Noto Sans JP',system-ui}
.box{width:240px;border:1px solid #f00;margin:8px;font-size:18px;line-height:1.8}
.a{word-break:normal;line-break:strict;overflow-wrap:break-word}
.b{word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
.lbl{font-size:11px;color:#888}
</style></head><body>
<div class="lbl">normal:</div>
<div class="box a">ステラに電話してください。新鮮なスナップエンドウ6杯、ブルーチーズの厚切り5枚が必要です。</div>
<div class="lbl">auto-phrase:</div>
<div class="box b">ステラに電話してください。新鮮なスナップエンドウ6杯、ブルーチーズの厚切り5枚が必要です。</div>
</body></html>

[package]
name = "moonlens"
version = "0.1.0"
description = "PC-resident Google Lens-style tool"
authors = ["MoonLens contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.92"

[lib]
name = "moonlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the vendored whisper.cpp (feature `local-asr`).
cc = "1"

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    # Enable `WebviewWindowBuilder::transparent()` on macOS. Our lens and
    # overlay windows depend on platform-native transparency; without this
    # feature the macOS target fails to build (the method is gated off).
    "macos-private-api",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# A second launch focuses the running instance instead of starting a
# second tray icon whose hotkeys all fail to register.
tauri-plugin-single-instance = "2"
# Free disk space before a multi-GB model download.
fs4 = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Plugin signature verification
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"

# async / util
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"

# serde / schema / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

# http
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# image / capture / ocr / qr
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
xcap = "0.9"
ocrs = { version = "0.14", optional = true }
rten = { version = "0.28", optional = true, features = ["rten_format"] }
rten-tensor = { version = "0.28", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# ONNX Runtime for the PP-OCR models. The library is loaded at run time
# from the models directory (providers/ocr_onnx.rs), never linked or
# downloaded by the build. `api-24` must match RUNTIME_VERSION there.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }
rqrr = "0.7"

# audio
cpal = { version = "0.15", optional = true }

# Composite window for stream capture (Windows; a stub elsewhere).
moonlens-stream = { path = "crates/stream" }

# storage
rusqlite = { version = "0.43", features = ["bundled"] }

# local LLM inference (llama.cpp, statically linked). CPU everywhere;
# GPU backends: Metal on macOS and Vulkan on Windows / Linux (target
# sections below). CUDA is opt-in via `llm-cuda` (needs the CUDA toolkit).
llama-cpp-2 = { version = "0.1.161", default-features = false, optional = true }
# Direct dependency only so build.rs can compile whisper.cpp against
# the ggml this crate builds (DEP_LLAMA_GGML_CMAKE_DIR); see build.rs.
llama-cpp-sys-2 = { version = "0.1.161", default-features = false, optional = true }
# Renders the chat template embedded in each GGUF.
minijinja = { version = "2", optional = true, features = ["loop_controls", "json"] }
minijinja-contrib = { version = "2", optional = true, default-features = false, features = ["pycompat"] }

# plugin runtime
wasmtime = { version = "36", features = ["component-model", "runtime"] }
wasmtime-wasi = "36"
# Total RAM / CPU model for the first-run model recommendation (setup.rs).
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, optional = true, features = ["metal"] }

# Vulkan on Windows and Linux: runs on NVIDIA, AMD and Intel GPUs through
# the installed driver, with no vendor runtime to ship. Building needs the
# Vulkan SDK (Windows: LunarG SDK + VULKAN_SDK; Linux: libvulkan-dev,
# glslc, spirv-headers). Without a usable GPU the engine runs on the CPU;
# on Windows vulkan-1.dll is delay-loaded (build.rs, src/gpu.rs) so a PC
# without it still starts.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, optional = true, features = ["vulkan"] }

# Pointer position for click-through lens windows: tao's cursor position
# on Linux is the last one its own windows saw, stale once the window lets
# the mouse through, so the X server is asked directly.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[features]
default = ["audio", "ocrs-engine", "ocr-onnx", "local-llm", "local-asr"]
local-llm = ["dep:llama-cpp-2", "dep:minijinja", "dep:minijinja-contrib"]
# Built-in speech recognition for live subtitles: whisper.cpp (vendored)
# linked against llama.cpp's ggml, so GPU features apply to both.
local-asr = ["local-llm", "dep:llama-cpp-sys-2"]
llm-vulkan = ["local-llm", "llama-cpp-2/vulkan"]
llm-cuda = ["local-llm", "llama-cpp-2/cuda"]
audio = ["dep:cpal"]
ocrs-engine = ["dep:ocrs", "dep:rten", "dep:rten-tensor", "dep:flate2", "dep:tar"]
# PP-OCR on ONNX Runtime (CPU, and DirectML on Windows) beside rten.
ocr-onnx = ["ocrs-engine", "dep:ort"]

[dev-dependencies]
# Paused clock for timer-driven tests.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wat = "1"

# Windows.Media.Ocr (WinRT): the OS's own OCR engine, used in the OCR
# chain next to PP-OCR (providers/ocr_windows.rs).
[target.'cfg(windows)'.dependencies]
# DirectML: the GPU path of ONNX Runtime on Windows.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["directml"] }
libloading = "0.8"
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
windows-future = "0.3"

# tests/lens_capture_windows.rs: a probe window over a screen region.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# OCR inference in an unoptimized build takes ~30 s per capture, which
# makes `tauri dev` (and the debug-mode test suite) feel broken.
# Optimize the ML / image crates even in dev; our own crate stays fast
# to rebuild.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-sequence]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.rqrr]
opt-level = 3
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3

# PLaMo 3 Translate needs the `plamo3` tokenizer, which is in
# llama-cpp-rs main (llama.cpp cd959ba) but not yet in the latest
# crates.io release (0.1.161). Drop this once 0.1.162+ is published.
[patch.crates-io]
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "955aa2f72463c2535cc5ab894d5d52f27a38cde2" }
llama-cpp-sys-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "955aa2f72463c2535cc5ab894d5d52f27a38cde2" }

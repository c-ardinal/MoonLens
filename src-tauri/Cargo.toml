[package]
name = "moonlens"
version = "0.1.0"
description = "PC-resident Google Lens-style tool"
authors = ["MoonLens contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "moonlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Project-wide clippy posture. Applies to the lib + every example +
# every integration test in this crate (the equivalent `#![allow]` in
# `lib.rs` would NOT propagate to examples / tests, which compile as
# separate crates that share this manifest).
#
# - `doc_lazy_continuation` and `doc_overindented_list_items` fire on
#   plain prose paragraphs that incidentally contain `+ word` / `- word`
#   shapes (the linter mistakes them for unindented list items). The
#   doc comments render correctly in rustdoc; the warnings are noise.
# - `too_many_arguments` triggers on a handful of legitimately complex
#   functions (spec-decode bootstrap, lens streaming pipeline) where
#   the per-argument doc comments would be lost in a struct refactor;
#   silencing project-wide avoids 10 individual `#[allow]` attrs.
# - `needless_range_loop` fires when an index variable IS used in the
#   loop body (typically for `assert_eq!` failure messages or
#   parallel-array indexing). The lint can't tell the difference.
[lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    # Enable `WebviewWindowBuilder::transparent()` on macOS. Our lens and
    # overlay windows depend on platform-native transparency; without this
    # feature the macOS target fails to build (the method is gated off).
    "macos-private-api",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Plugin signature verification
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"

# async / util
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
# Used by `providers::placeholder` for the protected-token regex
# pattern (timestamps, snake_case, module paths, ...). Already a
# transitive dependency (via tracing-subscriber + others) so this
# direct entry doesn't add to the compile cost.
regex = "1"

# serde / schema / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

# http
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
bytes = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cross-platform hardware probe (RAM, CPU cores). Used by the
# embedded-model onboarding to recommend a tier without making the
# user guess. `default-features = false` skips the disk / network /
# user kits we do not need for a one-shot RAM read.
sysinfo = { version = "0.30", default-features = false }

# image / capture / ocr / qr
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
xcap = "0.9"
ocrs = { version = "0.8", optional = true }
rten = { version = "0.13", optional = true }
rqrr = "0.7"
# PP-OCRv5 (DBNet + SVTR) via ONNX Runtime. Replaces the ocrs
# baseline as the primary OCR engine (see
# docs/benchmarks/2026-05-14-ocr-bench-iter5.md — wins on every
# language tested by 5× CER margin). Optional + feature-gated to
# keep CPU-smoke / no-default-features builds fast.
oar-ocr = { version = "0.6", optional = true }
oar-ocr-core = { version = "0.6", optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.16", optional = true }

# Embedded local LLM inference. Switched 2026-05-09 from mistralrs
# (Pure Rust) to llama-cpp-2 (FFI to llama.cpp) after the in-app
# benchmark consistently showed mistralrs CPU paths under 30% of
# the llama.cpp baseline on user hardware. The trade-off:
# llama-cpp-2 needs a C++ toolchain at BUILD time (Visual Studio
# 2022 Build Tools on Windows / Xcode CLI on macOS / gcc-ish on
# Linux) but the resulting binary is what's distributed to end
# users — they never need C++ themselves.
#
# Both crates kept feature-gated so:
#   - `cargo check --no-default-features` skips heavy ML deps in CI
#   - the `MistralRsEngine` impl is preserved for fallback / A/B
llama-cpp-2 = { version = "0.1", optional = true }
# `token_to_piece` requires a stateful UTF-8 decoder so multi-byte
# tokens (CJK punctuation, emoji, …) are not split. The crate is
# already pulled in transitively via `llama-cpp-2` — declaring it
# here so we can use it directly in the inference loop without an
# extra version pin.
encoding_rs = "0.8"
mistralrs = { version = "0.8", optional = true, default-features = false }

# audio
cpal = { version = "0.15", optional = true }

# storage
rusqlite = { version = "0.31", features = ["bundled"] }

# plugin runtime
wasmtime = { version = "24", features = ["component-model", "runtime"] }
wasmtime-wasi = "24"

# Windows-only: exclude the Lens window from screen capture so xcap
# sees the underlying source instead of our own transparent chrome
# (`WDA_EXCLUDEFROMCAPTURE`). Also the Windows.Media.Ocr WinRT APIs,
# which give us a native Japanese / CJK-capable OCR engine — the
# whole reason Japanese source text stops rendering as alphanumeric
# gibberish once the `windows` OCR provider is the primary backend.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[features]
# `embedded-llm` is in the default set as of 2026-05-09. The
# embedded LLM is the standard built-in translation engine — without
# it the app advertises a translator that returns
# "feature disabled at compile time" on every Lens line, which the
# user reasonably reads as "the app is broken". The feature flag
# itself is kept so `cargo check --no-default-features` still works
# in CI smoke builds (the LLM crate has a long compile tail; CI
# does not need to pay it for type-only checks).
#
# Backend split (20.x): `embedded-llm` now means "the llama.cpp
# backend via llama-cpp-2" — the production runtime. The legacy
# mistralrs backend is kept behind `embedded-llm-mistralrs` for
# A/B comparison only; it is NOT in the default set.
# Default features ship the CPU-only embedded LLM. GPU offload
# (`embedded-llm-vulkan`) is reserved for **release** builds via
# `npm run tauri:build` or `cargo build --release --features
# embedded-llm-vulkan`.
#
# Why GPU is opt-in rather than default:
# Phase 27 investigation (2026-05-13) tried making
# `embedded-llm-vulkan` the default. Release builds worked; debug
# builds (which Tauri's `npm run tauri:dev` produces) consistently
# fail in `llama-cpp-sys-2`'s nested `vulkan-shaders-gen`
# ExternalProject build with either:
#   - Visual Studio generator: race between configure/build/install
#     of vulkan-shaders-gen vcxproj
#   - Ninja generator: `LNK1104: cannot open intermediate.manifest`
#     from CMake's `vs_link_exe` wrapper during the inner cmake's
#     C compiler probe
# The wrapper is upstream-controlled; neither
# `CMAKE_EXE_LINKER_FLAGS_INIT=/MANIFEST:NO` nor
# `CMAKE_GENERATOR=Ninja` plus a fully-pinned MSVC env got the
# debug build through. End users producing installers via
# `tauri:build` (release) get GPU automatically; developers
# iterating via `tauri:dev` get the CPU fallback that links cleanly.
#
# To opt into a GPU dev build anyway (and accept the
# vulkan-shaders-gen build flake):
#   `cargo build --no-default-features --features
#    audio,ocrs-engine,embedded-llm-vulkan`
# A `tauri.conf.json` `beforeDevCommand` override can pin this
# per-dev-machine if the build happens to work on that host.
default = [
    "audio",
    "ocrs-engine",
    "embedded-llm-vulkan",
    "paddleocr-engine",
    "paddleocr-directml",
]
audio = ["dep:cpal"]
ocrs-engine = ["dep:ocrs", "dep:rten"]
# PaddleOCR PP-OCRv5 via oar-ocr + ONNX Runtime. `paddleocr-engine`
# pulls in the CPU runtime; `paddleocr-directml` enables the
# DirectML execution provider so `OarOcrProvider::with_gpu(true)`
# can offload to any DirectX 12 GPU on Windows (NVIDIA / AMD /
# Intel). Mirrors the embedded-llm-vulkan opt-in pattern.
paddleocr-engine = [
    "dep:oar-ocr",
    "dep:oar-ocr-core",
    "dep:ort",
    "dep:ndarray",
]
paddleocr-directml = ["paddleocr-engine", "oar-ocr/directml"]
embedded-llm = ["dep:llama-cpp-2"]
# GPU-offload variants. The `embedded-llm` base feature builds
# llama.cpp CPU-only; adding `-vulkan` or `-cuda` pulls in the
# corresponding ggml backend so `n_gpu_layers > 0` can offload
# tensors to the GPU. Vulkan works on any GPU with a Vulkan 1.1+
# driver (Intel iGPU / AMD / NVIDIA — broadest reach). CUDA is
# NVIDIA-only and needs the CUDA Toolkit installed at build time.
embedded-llm-vulkan = ["embedded-llm", "llama-cpp-2/vulkan"]
embedded-llm-cuda = ["embedded-llm", "llama-cpp-2/cuda"]
# Metal backend is macOS-only and currently a placeholder so the
# `cfg!(feature = "embedded-llm-metal")` checks in `hardware_probe.rs`
# (and the user-facing docs in `pipeline.rs`) compile cleanly without
# raising `unexpected_cfgs`. Wire to `llama-cpp-2/metal` once a Mac
# build target lands.
embedded-llm-metal = ["embedded-llm"]
embedded-llm-mistralrs = ["dep:mistralrs"]

[dev-dependencies]
tempfile = "3"
wat = "1"
# Offline Lens-pipeline evaluator (examples/lens_eval.rs) renders
# OCR-derived cards on top of a source image and annotates each with
# computed font-size / weight so the user can compare visually with
# the original source. ab_glyph handles TTF glyph rasterisation,
# imageproc does the fills / outlines / text composites.
ab_glyph = "0.2"
imageproc = { version = "0.25", default-features = false }
# Pure-Rust PaddleOCR PP-OCRv5 (DBNet detection + SVTR recognition)
# via `tract-onnx`. No C++ / ONNX Runtime dependency — the binary
# stays pure-Rust buildable. Models live under tests/models/ppocrv5/.
pure-onnx-ocr = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimise ML inference crates even in debug builds. Tauri's default
# `npm run tauri:dev` uses `cargo build` (debug), which makes every
# `rten` tensor op 60-100x slower than release — enough to push a
# trivial 476x301 OCR from ~250ms to >15s and trip the chain timeout.
# Only ocrs/rten are flagged, so Tauri / Svelte hot-reload stays fast.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
# Image decode/encode is also hit per poll; keep it fast in dev.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
# llama.cpp itself is built as Release C++ via the cmake feature,
# but the Rust wrapper (`llama-cpp-2`) and the FFI bindings
# (`llama-cpp-sys-2`) sit in front of every per-token call:
# `LlamaSampler::sample`, `LlamaBatch::add`, `token_to_piece` (with
# its `encoding_rs::Decoder` state machine), and the `LlamaContext`
# wrappers all run as Rust. In a debug `cargo run` build those
# layers add real overhead per token — measurably enough to push
# 0.5B Q4 from ~50 tok/s to ~10 tok/s, which masks the runtime
# swap entirely. Keeping them at opt-level 3 in dev mode mirrors
# the existing rten / ocrs treatment.
[profile.dev.package.llama-cpp-2]
opt-level = 3
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
# encoding_rs's stateful UTF-8 decoder runs once per generated
# token via `token_to_piece`; same reasoning as above.
[profile.dev.package.encoding_rs]
opt-level = 3

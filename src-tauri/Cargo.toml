[package]
name = "moonlens"
version = "0.1.0"
description = "PC-resident Google Lens-style tool"
authors = ["MoonLens contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "moonlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

# async / util
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"

# serde / schema / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"

# http
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# image / capture / ocr / qr
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
xcap = "0.0.14"
ocrs = { version = "0.8", optional = true }
rqrr = "0.7"

# audio
cpal = { version = "0.15", optional = true }

# storage
rusqlite = { version = "0.31", features = ["bundled"] }

# plugin runtime
wasmtime = { version = "24", features = ["component-model"] }

[features]
default = ["audio", "ocrs-engine"]
audio = ["dep:cpal"]
ocrs-engine = ["dep:ocrs"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

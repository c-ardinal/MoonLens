[package]
name = "wasm-hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.30", features = ["bitflags"] }

[package.metadata.component]
package = "moonlens:plugin"

[package.metadata.component.target]
path = "wit"
world = "plugin"

[profile.release]
# Keep the fixture binary small — it is committed to the repository
# so every shrink helps.
opt-level = "z"
lto = true
codegen-units = 1
strip = true

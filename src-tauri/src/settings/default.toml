# MoonLens default configuration. Every setting has a default so partial
# user overrides are safe. Delete any section you do not want to override.

config_version = 1
active_profile = "default"

[appearance]
theme = "dark"
accent = "#FFB547"
density = "normal"
text_size = "medium"
ui_language = "ja"
font_family_ui = "Inter Variable"
font_family_mono = "JetBrains Mono"
reduced_motion = false

[hotkeys]
capture_region = "CommandOrControl+Shift+Space"
capture_window = "CommandOrControl+Shift+W"
toggle_pin_overlay = "CommandOrControl+Shift+P"
toggle_window_operate = "CommandOrControl+Shift+E"
toggle_subtitle = "CommandOrControl+Shift+S"
open_command_palette = "CommandOrControl+K"
open_history = "CommandOrControl+Shift+H"
reverse_image_search = "CommandOrControl+Shift+G"
custom = {}

[overlay]
max_width_px = 480
opacity = 0.92
blur_px = 24
saturation = 1.8
font_size_px = 14
line_height = 1.5
follow_source = true
position = "near_source"
show_in_screenshots = true

[subtitle]
source_language = "auto"
target_language = "ja"
model = "large-v3-turbo"
fallback_model = "base"
vad_aggressiveness = 2
chunk_seconds = 3.0
overlap_seconds = 0.5
show_original = true
font_size_px = 22

[clipboard]
auto_copy_translation = true
auto_copy_source = false
auto_copy_qr = true
auto_copy_transcript = false

[translation]
# Japanese output style: "auto" (model decides), "polite" (desu/masu),
# "plain" (da/dearu). Ignored for other target languages.
style = "auto"
# Fixed term renderings, e.g.
#   glossary = [{ source = "Dashboard", target = "管理画面", lang = "ja" }]
# `lang` is the target language of the rendering ("" = any).
glossary = []

[privacy]
# Cloud providers (deepl, gemini) are refused unless this is turned on.
allow_cloud_globally = false
show_privacy_indicator = true
notify_on_fallback_to_cloud = true
log_level = "info"
redact_sensitive_in_logs = true

[storage]
keep_history = true
retention_days = 90
max_entries = 10000
encrypt_at_rest = false
save_capture_images = true

[performance]
streaming_debounce_ms = 50
region_watcher_poll_ms = 250
scan_margin_px = 32
max_concurrent_tasks = 4
cache_ttl_seconds = 3600
use_gpu_if_available = true

# ---------------------------------------------------------------------------
# Providers
# Each task declares an ordered chain and fallback policy. Provider ids of the
# form "vendor.model" or "plugin.<id>" are resolved at runtime against the
# registered providers (built-in or loaded from plugins).
# ---------------------------------------------------------------------------

# Translation, explanation and summaries run fully on-device with the
# built-in engine. Cloud providers (deepl, gemini) stay available but are
# opt-in: add them to a chain and set allow_cloud / allow_network.
[providers.translate]
chain = ["llamacpp"]
parallel_race = false
fallback_on = ["timeout", "error", "offline"]
# Local LLMs stream the translation; 3 s cut paragraph-sized OCR text
# off mid-stream (a cold CPU request alone takes 3-5 s).
timeout_ms = 15000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 30000

[providers.ocr]
# ppocr: PP-OCR (Japanese / Chinese / English, more scripts on request). Falls through to the
# Latin-only ocrs engine until its models are installed.
chain = ["ppocr", "ocrs"]
parallel_race = false
fallback_on = ["low_confidence", "error"]
timeout_ms = 5000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 0

# Built-in whisper.cpp. A chunk can hold up to ~28 s of backlog, which a
# CPU-only PC may need several seconds to decode.
[providers.asr]
chain = ["whisper"]
parallel_race = false
fallback_on = ["error"]
timeout_ms = 60000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 0

[providers.explain]
chain = ["llamacpp.assistant"]
parallel_race = false
fallback_on = ["timeout", "error", "offline"]
timeout_ms = 10000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 60000

[providers.summarize]
chain = ["llamacpp.assistant"]
parallel_race = false
fallback_on = ["timeout", "error", "offline"]
timeout_ms = 10000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 60000

# Reverse image search sends the image to a web service, so no built-in
# provider is enabled (MoonLens is fully local). A plugin may add one.
[providers.reverse_image_search]
chain = []
parallel_race = false
fallback_on = ["error"]
timeout_ms = 3000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 0

[providers.qr_handler]
chain = ["rqrr"]
parallel_race = false
fallback_on = ["error"]
timeout_ms = 1000
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 0

[providers.intent_classifier]
chain = ["builtin.heuristic"]
parallel_race = false
fallback_on = ["error"]
timeout_ms = 500
allow_cloud = false
allow_network = false
max_cost_per_request = 0.0
sticky_session_ms = 0

# ---------------------------------------------------------------------------
# Per-provider configuration. Unknown keys are preserved verbatim so plugins
# can declare their own settings without the core knowing the shape.
# ---------------------------------------------------------------------------

# Built-in llama.cpp engine: no external runtime needed. Models are
# downloaded from the home screen. `model` is a catalog id:
#   translation: "plamo-3-translate-2b" (default), "plamo-3-translate-0.8b"
#   general:     "gemma-4-e4b" (default), "gemma-4-e2b"
# Set `model_path` (+ `prompt_style = "pfml3"` for PLaMo) to run any
# other GGUF file instead.
[providers.configs.llamacpp]
model = "plamo-3-translate-2b"
n_ctx = 4096
temperature = 0.0
threads = 0

# General model for explain / summarize (PLaMo only translates).
[providers.configs."llamacpp.assistant"]
model = "gemma-4-e4b"
n_ctx = 4096
temperature = 0.0
top_p = 0.9
threads = 0

# Optional: an Ollama server, for anyone who prefers it. Not used by the
# default chains; add "ollama.gemma4" to a chain to enable it.
#
# Model choice for both backends is backed by the benchmark in
# docs/translation-models.md. With Ollama, `gemma4:e4b` also serves
# explain / summarize; `hf.co/pfnet/plamo-3-translate-2b-GGUF:Q4_K_M` is the
# better translator (translation only) and gets its PFML3 prompt
# automatically.
[providers.configs."ollama.gemma4"]
endpoint = "http://127.0.0.1:11434"
model = "gemma4:e4b"
temperature = 0.0
top_p = 0.9
num_ctx = 4096
stream = true
# Keep the weights resident between captures (Ollama's own default is 5m).
keep_alive = "30m"
# Thinking-capable models reason before answering unless told not to;
# translation does not benefit and it multiplies latency.
think = false
# Optional override for the translator prompt. Leave unset to use the
# built-in prompt, which names the source / target languages.
# system_prompt = "..."

[providers.configs.deepl]
api_key_env = "DEEPL_API_KEY"
endpoint = "https://api-free.deepl.com/v2/translate"
formality = "default"

[providers.configs.gemini]
api_key_env = "GEMINI_API_KEY"
model = "gemini-2.5-flash"
temperature = 0.2

# Built-in speech recognition (whisper.cpp) for live subtitles. Models
# are downloaded from the settings screen. `model` is a catalog id:
# "whisper-large-v3-turbo" (default) or "whisper-small".
# GPU use follows `performance.use_gpu_if_available`.
[providers.configs.whisper]
model = "whisper-large-v3-turbo"
threads = 0
beam_size = 1

# Optional: an external whisper.cpp server, for anyone who prefers it.
# Not used by the default chain; put "whisper_cpp.large_v3_turbo" in
# `[providers.asr] chain` to enable it.
[providers.configs."whisper_cpp.large_v3_turbo"]
endpoint = "http://127.0.0.1:9002"

[providers.configs.ocrs]
detection_threshold = 0.4
recognition_threshold = 0.5

[providers.configs.ppocr]
# What runs the networks: "auto" (the fastest that loads on this PC,
# measured at model load), "directml" (GPU, Windows), "onnx-cpu" or
# "rten".
backend = "auto"
det_max_side = 1600
det_threshold = 0.3
box_threshold = 0.6
unclip_ratio = 1.6
min_confidence = 0.5

# ---------------------------------------------------------------------------
# Plugins. Enabled map is populated as users install plugins.
# ---------------------------------------------------------------------------

[plugins]
auto_update_check = false
require_signature = false
trusted_publishers = []

[plugins.enabled]

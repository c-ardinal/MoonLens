# cargo-about config for scripts/third-party-licenses.mjs.
# Licences we accept in the shipped app. A crate under any other licence
# makes the release job fail, so a new copyleft dependency is noticed.
accepted = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unlicense",
  "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  "CDLA-Permissive-2.0", "NCSA", "bzip2-1.0.6",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

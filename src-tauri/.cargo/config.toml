# Build options for the bundled llama.cpp (llama-cpp-sys-2 forwards
# GGML_* variables to CMake).
#
# Without these the x86-64 build only uses SSE2 and local translation is
# several times slower. AVX2 + FMA + F16C (x86-64-v3) covers every
# Intel CPU since Haswell (2013) and AMD since Excavator (2015); the app
# checks for them at runtime and falls back to the next provider in the
# chain instead of crashing on older CPUs. Ignored on ARM targets.
[env]
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"

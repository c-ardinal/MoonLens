name: windows

# Windows check for changes to native code: the bundled llama.cpp
# (built with CMake + MSVC, bindings via libclang), its build flags and
# the Rust dependency graph. Those are the changes most likely to build
# on Linux but break on Windows, the primary user platform.
#
# Runs automatically on PRs that touch those paths, so it needs no
# manual trigger (the "Run workflow" button only appears for workflows
# on the default branch `main`, which holds no code). Everything else
# stays Linux-only to keep Windows' x2 billing minutes rare.
#
# The `lens-e2e` job (30+ minutes) runs only on PRs into `main` /
# `release`, on PRs labelled `lens-e2e`, and on manual runs.

on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/build.rs'
      - 'src-tauri/.cargo/**'
      - 'src-tauri/src/providers/translate_llama.rs'
      - 'src-tauri/src/providers/llm_models.rs'
      - 'src-tauri/src/gpu.rs'
      # Screen capture and the Lens window's capture exclusion behave
      # differently on Windows (tests/lens_capture_windows.rs).
      - 'src-tauri/src/capture.rs'
      - 'src-tauri/src/lens.rs'
      - 'src-tauri/tests/lens_capture_windows.rs'
      # Screen → OCR → translation on a real desktop (lens-e2e job).
      - 'src-tauri/src/selector.rs'
      - 'src-tauri/src/intent.rs'
      - 'src-tauri/src/pipeline.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/src/providers/ocr_*.rs'
      - 'src-tauri/tests/lens_screen_windows_live.rs'
      - 'src-tauri/examples/fetch_models.rs'
      # Live subtitles: loopback capture of what the PC plays, speech
      # recognition and translation (lens-e2e job).
      - 'src-tauri/src/audio.rs'
      - 'src-tauri/src/subtitle.rs'
      - 'src-tauri/src/providers/asr_*.rs'
      - 'src-tauri/native/**'
      - 'src-tauri/vendor/whisper.cpp/**'
      - 'src-tauri/tests/fixtures/audio/**'
      - 'src-tauri/tests/subtitle_live.rs'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fetch git dependencies (llama-cpp-rs and its llama.cpp submodule)
  # with the git CLI: cargo's built-in libgit2 fetch of the submodule
  # stalled for the whole job timeout on a Windows runner.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: rust (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # llama.cpp's Vulkan backend builds against the Vulkan SDK. Only the
      # SDK, no runtime: with no vulkan-1.dll on the runner, the tests
      # check that the delay-loaded app still starts and falls back to
      # the CPU (src/gpu.rs).
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true

      # llama.cpp's Vulkan backend builds a nested CMake project
      # (vulkan-shaders-gen) whose paths under the default target dir
      # exceed MAX_PATH. Build with Ninja in an MSVC developer shell and a
      # short target dir.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Use Ninja for CMake
        shell: bash
        run: |
          pip install ninja
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # llama.cpp's nested vulkan-shaders-gen build creates paths past
          # MAX_PATH under the default target dir (link.exe LNK1104 on
          # intermediate.manifest); keep the target dir short.
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - name: Report Vulkan loader on the runner
        shell: bash
        run: |
          if [ -f /c/Windows/System32/vulkan-1.dll ]; then
            echo "vulkan-1.dll present: the GPU path is exercised"
          else
            echo "vulkan-1.dll absent: the CPU fallback path is exercised"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}

      # llama-cpp-sys-2 currently comes from git (see [patch.crates-io]
      # in Cargo.toml); its llama.cpp submodule has paths past Windows'
      # 260-char limit under ~/.cargo/git/checkouts.
      - name: Allow long paths for git checkouts
        shell: bash
        run: git config --global core.longpaths true

      # bindgen (llama-cpp-sys-2) needs libclang; the runner ships LLVM.
      - name: Point bindgen at LLVM
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Stub frontend dist
        shell: bash
        run: mkdir -p build

      - name: Clippy (src-tauri)
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast

  # Real-desktop end-to-end check of what users see on Windows: fixture
  # images shown on screen, read back through the app's capture paths,
  # OCR'd by each engine and translated by the built-in model; then the
  # release-mode app itself is started to check that it writes its log.
  # Captures, report and log are uploaded as the `lens-e2e` artifact.
  #
  # Too heavy for every PR: it runs on PRs into `main` / `release`
  # (develop → main, release PRs), on a PR labelled `lens-e2e` (work on
  # capture, OCR or subtitles that needs the real-desktop check before
  # merge; the label counts from the next push) and on manual runs.
  # Elsewhere the job is skipped, which a required check counts as
  # passed.
  lens-e2e:
    name: lens e2e (windows)
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.base_ref == 'main'
      || github.base_ref == 'release'
      || contains(github.event.pull_request.labels.*.name, 'lens-e2e')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Release speed for OCR / llama.cpp without the shipping profile's
      # full LTO link time.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      MOONLENS_E2E_OUT: ${{ github.workspace }}\e2e-out
    steps:
      - uses: actions/checkout@v5

      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Use Ninja for CMake
        shell: bash
        run: |
          pip install ninja
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-e2e
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}

      - name: Allow long paths for git checkouts
        shell: bash
        run: git config --global core.longpaths true

      - name: Point bindgen at LLVM
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # The real frontend, so the release app started below is the app
      # users get (minus the installer).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend build
        run: |
          npm ci
          npm run build

      # Informational. WinRT types load only in Windows PowerShell 5.1.
      - name: Report screen and OCR languages
        continue-on-error: true
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, Primary
          [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime] | Out-Null
          "OCR languages: " + (([Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag }) -join ', ')

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\io.moonlens.app\models
          key: moonlens-models-v2

      - name: Download models
        working-directory: src-tauri
        run: cargo run --release --locked --example fetch_models

      # ONNX Runtime (CPU and DirectML) against rten on the fixture
      # images: same text, plus the backend the automatic choice takes
      # on this runner and the time each one needs.
      - name: OCR backends read the same text
        working-directory: src-tauri
        run: cargo test --release --locked --lib backends_read_the_same_lines -- --ignored --nocapture

      - name: Screen → OCR → translation
        working-directory: src-tauri
        run: cargo test --release --locked --test lens_screen_windows_live -- --ignored --nocapture

      # Hosted runners have no sound card. A virtual output device lets
      # the test play real speech and capture it back through WASAPI
      # loopback, the way the app hears a video.
      - name: Virtual audio device
        if: always()
        uses: LABSN/sound-ci-helpers@v1

      # Recorded English speech → subtitle loop → recognized text and its
      # Japanese translation; once fed directly, once played on the
      # output device and captured by the app's loopback capture.
      - name: Speech → subtitles
        if: always()
        working-directory: src-tauri
        env:
          MOONLENS_REQUIRE_AUDIO: '1'
        run: cargo test --release --locked --test subtitle_live -- --ignored --nocapture --test-threads 1

      - name: Build the release app
        if: always()
        working-directory: src-tauri
        run: cargo build --release --locked --bin moonlens

      # The reporter's install wrote a 0-byte log. Start the GUI-subsystem
      # release binary, let it warm up, and require a non-empty log with
      # the start line.
      - name: Release app writes its log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'io.moonlens.app\logs\moonlens.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'D:\t\release\moonlens.exe' -PassThru
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force $env:MOONLENS_E2E_OUT | Out-Null
          $bmp.Save((Join-Path $env:MOONLENS_E2E_OUT 'app-desktop.png'))
          $alive = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (Test-Path $log) { Copy-Item $log $env:MOONLENS_E2E_OUT }
          "app still running after 45 s: $alive"
          if (-not (Test-Path $log)) { throw "no log file at $log" }
          $text = Get-Content $log -Raw
          "log size: $((Get-Item $log).Length) bytes"
          $text
          if (-not $text -or $text -notmatch 'MoonLens .* start') { throw 'log is empty or lacks the start line' }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-e2e
          path: e2e-out
          if-no-files-found: warn

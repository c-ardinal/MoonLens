name: windows

# Windows check for changes to native code: the bundled llama.cpp
# (built with CMake + MSVC, bindings via libclang), its build flags and
# the Rust dependency graph. Those are the changes most likely to build
# on Linux but break on Windows, the primary user platform.
#
# Runs automatically on PRs that touch those paths, so it needs no
# manual trigger (the "Run workflow" button only appears for workflows
# on the default branch `main`, which holds no code). Everything else
# stays Linux-only to keep Windows' x2 billing minutes rare.

on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/build.rs'
      - 'src-tauri/.cargo/**'
      - 'src-tauri/src/providers/translate_llama.rs'
      - 'src-tauri/src/providers/llm_models.rs'
      - 'src-tauri/src/gpu.rs'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fetch git dependencies (llama-cpp-rs and its llama.cpp submodule)
  # with the git CLI: cargo's built-in libgit2 fetch of the submodule
  # stalled for the whole job timeout on a Windows runner.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: rust (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # llama.cpp's Vulkan backend builds against the Vulkan SDK. Only the
      # SDK, no runtime: with no vulkan-1.dll on the runner, the tests
      # check that the delay-loaded app still starts and falls back to
      # the CPU (src/gpu.rs).
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true

      # llama.cpp's Vulkan backend builds a nested CMake project
      # (vulkan-shaders-gen) whose paths under the default target dir
      # exceed MAX_PATH. Build with Ninja in an MSVC developer shell and a
      # short target dir.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Use Ninja for CMake
        shell: bash
        run: |
          pip install ninja
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # llama.cpp's nested vulkan-shaders-gen build creates paths past
          # MAX_PATH under the default target dir (link.exe LNK1104 on
          # intermediate.manifest); keep the target dir short.
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - name: Report Vulkan loader on the runner
        shell: bash
        run: |
          if [ -f /c/Windows/System32/vulkan-1.dll ]; then
            echo "vulkan-1.dll present: the GPU path is exercised"
          else
            echo "vulkan-1.dll absent: the CPU fallback path is exercised"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}

      # llama-cpp-sys-2 currently comes from git (see [patch.crates-io]
      # in Cargo.toml); its llama.cpp submodule has paths past Windows'
      # 260-char limit under ~/.cargo/git/checkouts.
      - name: Allow long paths for git checkouts
        shell: bash
        run: git config --global core.longpaths true

      # bindgen (llama-cpp-sys-2) needs libclang; the runner ships LLVM.
      - name: Point bindgen at LLVM
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Stub frontend dist
        shell: bash
        run: mkdir -p build

      - name: Clippy (src-tauri)
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast

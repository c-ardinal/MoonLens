name: release

# Tag-driven releases on a two-branch repository:
#   * `release` branch → pre-release tags (`v0.1.0-rc.1`, `-beta.N`,
#     `-alpha.N`). Published as GitHub pre-releases.
#   * `main` branch → full release tags (`v0.1.0`, `v0.1.1`).
#     Published as full releases.
#
# Pre-release vs full is decided by the tag name: a `-` suffix flags
# pre-release. The branch check below is advisory only — it logs a
# warning when the tag's branch does not match the convention, but
# never fails the build so emergency tags are always possible.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # On workflow_dispatch github.ref is the branch the run was
          # started from (usually the default branch), not the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check tag branch hygiene
        shell: bash
        env:
          # Passed via env, not interpolated into the script, so a
          # dispatch input can't inject shell.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          echo "Releasing tag: $tag"
          case "$tag" in
            *-*)
              expected=release
              ;;
            *)
              expected=main
              ;;
          esac
          commit=$(git rev-list -n 1 "$tag")
          if git merge-base --is-ancestor "$commit" "origin/$expected"; then
            echo "✓ tag $tag sits on origin/$expected (expected for this naming)"
          else
            echo "::warning::tag $tag is not reachable from origin/$expected; double-check you tagged on the right branch"
          fi
      # Version / tag / @tauri-apps pairing check (seconds, no installs).
      # Catches the mistakes that otherwise fail 20 min into the bundle.
      - name: Release preflight
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/check-release.mjs "$TAG"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        # Budget-saving mode: Linux only for this release cycle.
        # The free-tier minute budget is nearly exhausted and the
        # macOS runner's ×10 billing multiplier alone would push us
        # over. Windows bundles (.msi / .nsis) are produced locally
        # and attached via `gh release upload`; macOS is deferred to
        # the next release cycle.
        #
        # To restore full 3-platform output (after budget reset or
        # on a paid plan) uncomment the macos / windows entries.
        include:
          - { name: linux, os: ubuntu-latest, bundle: deb,appimage,rpm }
          # - { name: macos, os: macos-14, bundle: dmg }
          # - { name: windows, os: windows-latest, bundle: msi,nsis }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Build the tag itself, also when re-run via workflow_dispatch
      # (otherwise the dispatching branch, e.g. `main`, would be built
      # and uploaded under the tag's release).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Free disk space (linux)
        if: matrix.name == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/share/boost /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libasound2-dev libsoup-3.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev \
            libwayland-dev libegl1-mesa-dev libdrm-dev libxkbcommon-dev

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # `tauri build` runs `npm run build` itself (beforeBuildCommand),
      # so there is no separate frontend build step here.
      - name: Install JS deps
        run: npm ci

      # Licence texts of every Rust crate and npm package compiled into
      # the app, plus llama.cpp and the downloadable models. Bundled into
      # the installer via tauri.release.conf.json and attached to the
      # release as a separate file.
      - name: Third-party licences
        run: node scripts/third-party-licenses.mjs

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing secrets. If unset, bundles are produced
          # unsigned (valid for local use but users will see an
          # untrusted-developer warning on macOS / SmartScreen on
          # Windows). Populate these in repo settings once a signing
          # identity is available.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MoonLens ${{ github.event.inputs.tag || github.ref_name }}'
          # Created as a draft: check the assets and notes, then press
          # "Publish release" (see docs/RELEASING.md).
          releaseBody: |
            MoonLens は画面上の文字を端末内だけで OCR・翻訳する常駐ツールです。
            翻訳・OCR はすべてローカルで実行し、画像やテキストを外部へ送信しません。

            ## 導入
            | OS | ファイル |
            | --- | --- |
            | Windows | `MoonLens_*_x64-setup.exe`（推奨）または `*.msi` |
            | Linux | `*.AppImage`（実行権限を付けて起動）、`*.deb`、`*.rpm` |

            初回起動後、ホーム画面の「モデル準備」から翻訳モデルと OCR モデルを取得してください
            （既定の翻訳モデル PLaMo 3 Translate 2B は約 1.8 GB）。取得時のみ通信が発生します。

            インストーラーは未署名のため、Windows では SmartScreen の「詳細情報 → 実行」で起動します。

            変更点は `CHANGELOG.md`、同梱ライブラリとモデルのライセンスは
            `THIRD_PARTY_LICENSES.html` を参照してください。

            Built with PLaMo.
          releaseDraft: true
          # A tag like `v0.1.0-rc.1` contains a `-`; flag as pre-release.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          # No auto-updater: MoonLens makes no network calls except model
          # downloads the user starts. Users update from the release page.
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json

      - name: Attach licence file to the release
        if: matrix.name == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" THIRD_PARTY_LICENSES.html --clobber

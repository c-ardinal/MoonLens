name: release

# Tag-driven releases on a two-branch repository:
#   * `release` branch → pre-release tags (`v0.1.0-rc.1`, `-beta.N`,
#     `-alpha.N`). Published as GitHub pre-releases.
#   * `main` branch → full release tags (`v0.1.0`, `v0.1.1`).
#     Published as full releases.
#
# Pre-release vs full is decided by the tag name: a `-` suffix flags
# pre-release. The branch check below is advisory only — it logs a
# warning when the tag's branch does not match the convention, but
# never fails the build so emergency tags are always possible.

on:
  push:
    tags: ['v*']
  # Installer builds for a PR, on demand: label the PR
  # `installer:windows` and/or `installer:macos`. Nothing is published;
  # the installers are kept as run artifacts for 7 days. Used for test
  # builds of unreleased work and to dry-run changes to this file.
  # Without a label every job is skipped (no runner is taken).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A new push to the PR replaces its running build; adding a label
  # does not (the labelled run waits instead).
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Fetch git dependencies (llama-cpp-rs and its llama.cpp submodule)
  # with the git CLI: libgit2 stalled on the submodule on Windows.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  guard:
    # A PR without an `installer:*` label has nothing to build: skip
    # here so the run does not wait for (or hold) a runner.
    if: >-
      github.event_name != 'pull_request'
      || contains(join(github.event.pull_request.labels.*.name, ','), 'installer:')
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Platforms to build: all three for a tag, the labelled ones for a
      # PR (an empty list skips the build job).
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
        run: |
          linux='{"name":"linux","os":"ubuntu-latest","bundle":"deb,appimage,rpm"}'
          windows='{"name":"windows","os":"windows-latest","bundle":"msi,nsis"}'
          macos='{"name":"macos","os":"macos-latest","bundle":"app,dmg"}'
          if [ "$EVENT" != pull_request ]; then
            list="$linux,$windows,$macos"
          elif [ "$ACTION" = labeled ] && [ "${ADDED#installer:}" = "$ADDED" ]; then
            list=""   # some other label was added: nothing to build
          else
            list=""
            if echo "$LABELS" | grep -q '"installer:windows"'; then list="$windows"; fi
            if echo "$LABELS" | grep -q '"installer:macos"'; then list="${list:+$list,}$macos"; fi
          fi
          echo "matrix=[$list]" >> "$GITHUB_OUTPUT"
          echo "Build matrix: [$list]"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # On workflow_dispatch github.ref is the branch the run was
          # started from (usually the default branch), not the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check tag branch hygiene
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          # Passed via env, not interpolated into the script, so a
          # dispatch input can't inject shell.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          echo "Releasing tag: $tag"
          case "$tag" in
            *-*)
              expected=release
              ;;
            *)
              expected=main
              ;;
          esac
          commit=$(git rev-list -n 1 "$tag")
          if git merge-base --is-ancestor "$commit" "origin/$expected"; then
            echo "✓ tag $tag sits on origin/$expected (expected for this naming)"
          else
            echo "::warning::tag $tag is not reachable from origin/$expected; double-check you tagged on the right branch"
          fi
      # Version / tag / @tauri-apps pairing check (seconds, no installs).
      # Catches the mistakes that otherwise fail 20 min into the bundle.
      - name: Release preflight
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/check-release.mjs "$TAG"
      # This version's CHANGELOG.md section (folded from changelog.d/ by
      # `scripts/changelog.mjs release`) goes into the draft's body.
      - name: Release notes from CHANGELOG.md
        id: notes
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          {
            echo 'notes<<__NOTES_EOF__'
            node scripts/changelog.mjs notes "$TAG"
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Linux + Windows + macOS (Apple Silicon) on tag push; on a PR,
        # the platforms named by its `installer:*` labels. The repository
        # is public, so Actions minutes are free.
        include: ${{ fromJSON(needs.guard.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Build the tag itself, also when re-run via workflow_dispatch
      # (otherwise the dispatching branch, e.g. `main`, would be built
      # and uploaded under the tag's release).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Free disk space (linux)
        if: matrix.name == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/share/boost /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libasound2-dev libsoup-3.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev \
            libwayland-dev libegl1-mesa-dev libdrm-dev libxkbcommon-dev \
            libvulkan-dev glslc spirv-headers

      # llama.cpp's Vulkan backend needs the SDK to build (GPU inference
      # on Windows; see src-tauri/Cargo.toml).
      - name: Vulkan SDK (windows)
        if: matrix.name == 'windows'
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'windows'
      - name: Windows build environment
        if: matrix.name == 'windows'
        shell: bash
        run: |
          pip install ninja
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # llama.cpp's nested vulkan-shaders-gen build creates paths past
          # MAX_PATH under the default target dir (link.exe LNK1104 on
          # intermediate.manifest); keep the target dir short.
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
          # bindgen (llama-cpp-sys-2) needs libclang; the runner ships LLVM.
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          # llama.cpp submodule paths exceed 260 chars under ~/.cargo/git.
          git config --global core.longpaths true

      # Compiler cache in the Actions cache: llama.cpp / whisper.cpp
      # (C/C++, through CMake's compiler launcher) and the Rust crates.
      # Only our own crate, the LTO link and the bundler run every time.
      # Caches are scoped per ref: a re-run of the same tag (or PR) hits
      # it; a new tag reads the default branch's cache only. Measured
      # build times: docs/ci-and-release-policy.md ("Windows build speed").
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache
        shell: bash
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable

      # Registry + git checkouts only (llama-cpp-rs with its llama.cpp
      # submodule is a slow fetch); compiled code goes through sccache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}
          cache-targets: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # `tauri build` runs `npm run build` itself (beforeBuildCommand),
      # so there is no separate frontend build step here.
      - name: Install JS deps
        run: npm ci

      # Licence texts of every Rust crate and npm package compiled into
      # the app, plus llama.cpp and the downloadable models. Bundled into
      # the installer via tauri.release.conf.json and attached to the
      # release as a separate file.
      - name: Third-party licences
        run: node scripts/third-party-licenses.mjs

      # Apple signing / notarisation, only when the secrets exist. An
      # unset secret reaches the job as an empty string, and an empty
      # APPLE_SIGNING_IDENTITY would override the ad-hoc identity ("-")
      # in tauri.conf.json, so export only the non-empty ones.
      - name: Apple signing secrets (macos)
        if: matrix.name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              echo "::add-mask::${!v}"
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned bundles without signing secrets: SmartScreen warning
          # on Windows, Gatekeeper warning on macOS (ad-hoc signed, see
          # tauri.conf.json). Apple secrets are exported by the step
          # above when present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # Empty on a PR dry run: build only, no release.
          tagName: ${{ github.event_name != 'pull_request' && (github.event.inputs.tag || github.ref_name) || '' }}
          releaseName: 'MoonLens ${{ github.event.inputs.tag || github.ref_name }}'
          # Created as a draft: check the assets and notes, then press
          # "Publish release" (see docs/RELEASING.md).
          releaseBody: |
            MoonLens は画面上の文字を端末内で OCR・翻訳する常駐ツールです。
            翻訳・OCR は全処理をローカルで実行し、画像・テキストの外部送信はありません。

            ## 導入
            | OS | ファイル |
            | --- | --- |
            | Windows | `MoonLens_*_x64-setup.exe`（推奨）または `*.msi` |
            | macOS（Apple シリコン） | `MoonLens_*_aarch64.dmg` |
            | Linux | `*.AppImage`（実行権限の付与後に起動）、`*.deb`、`*.rpm` |

            初回起動後、ホーム画面の「モデル準備」で翻訳モデル・OCR モデルを取得してください
            （既定の翻訳モデル PLaMo 3 Translate 2B は約 1.8 GB）。通信の発生は取得時のみです。

            インストーラーは未署名です。
            - Windows：SmartScreen 表示時は「詳細情報 → 実行」で起動。
            - macOS：初回起動の拒否後、「システム設定 → プライバシーとセキュリティ」の「このまま開く」で起動。
              「壊れている」表示の場合は `xattr -dr com.apple.quarantine /Applications/MoonLens.app` を実行。

            ## 変更内容
            ${{ needs.guard.outputs.notes }}

            過去の変更履歴は `CHANGELOG.md`、同梱ライブラリ・モデルのライセンスは
            `THIRD_PARTY_LICENSES.html` を参照してください。

            Built with PLaMo.
          releaseDraft: true
          # A tag like `v0.1.0-rc.1` contains a `-`; flag as pre-release.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          # No auto-updater: MoonLens makes no network calls except model
          # downloads the user starts. Users update from the release page.
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json

      - name: Keep the installers (dry run, windows)
        if: github.event_name == 'pull_request' && matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: moonlens-windows-installers
          path: |
            D:/t/release/bundle/msi/*.msi
            D:/t/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Keep the installers (dry run, macos)
        if: github.event_name == 'pull_request' && matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: moonlens-macos-installers
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Attach licence file to the release
        if: matrix.name == 'linux' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" THIRD_PARTY_LICENSES.html --clobber

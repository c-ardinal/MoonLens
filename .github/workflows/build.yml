name: build

# CI is Linux-only by default. macOS (×10 billing multiplier) and
# Windows (×2 multiplier, ~30 min wall-clock) eat the free-tier
# budget disproportionately, so they are reserved for:
#
#   * `release.yml` — runs on tag push (packaging path).
#   * This workflow's `workflow_dispatch` with `all_platforms=true`
#     — on-demand cross-platform check before cutting a release tag.
#
# Triggers: PRs (any base) + pushes to `main` / `develop` / `release` only.
# Feature branches are covered by their PR, so a push to a branch
# with an open PR no longer runs the suite twice (push + PR).
# Run manually via workflow_dispatch for a branch without a PR.
#
# Two jobs run in parallel so frontend breakage reports in ~3 min
# instead of waiting behind the ~15 min Rust build:
#
#   * `frontend` — svelte-check, vitest, production `vite build`.
#   * `rust`     — rustfmt + clippy (-D warnings) + tests for all
#                  four crates (app, plugin SDK, two SDK examples).
#
# See docs/ci-and-release-policy.md for the budget rationale.

on:
  push:
    branches: [main, develop, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also run the Rust job on Windows + macOS (pre-tag smoke test)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only bloats the cache on CI.
  CARGO_INCREMENTAL: 0
  # Full debuginfo makes the src-tauri test build ~20 GB and slows the
  # link step; line tables keep file:line in panic backtraces at a
  # fraction of the size (smaller rust-cache too).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      # Same check the release workflow runs on a tag: app versions agree
      # and every @tauri-apps npm package matches its crate's major.minor
      # (`tauri build` refuses to bundle otherwise).
      - name: Release preflight
        run: |
          node scripts/check-release.mjs
          node --test scripts/portable-zip.test.mjs

      # Copy style (CLAUDE.md): no native-Japanese words in UI text and
      # messages; banned terms are checked in comments too.
      - name: Copy lint
        run: |
          node --test scripts/copy-lint.test.mjs
          npm run lint:copy

      # Display language (CLAUDE.md): Japanese is the source text; every
      # Japanese string needs its English entry in src/lib/i18n/en.json
      # and must reach the screen through t().
      - name: i18n lint
        run: |
          node --test scripts/i18n-lint.test.mjs
          npm run lint:i18n

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Vitest (logic + DOM render tests)
        run: npm test

      - name: Production build (vite)
        run: npm run build

      # 4px spacing grid: renders the build with a mocked IPC in headless
      # Chromium and fails on off-grid padding / margin / gaps, icon-text
      # gaps, glyph icons and off-centre rows (scripts/ui-audit/README.md).
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: UI grid audit (4px)
        run: npm run audit:grid

      # Viewport overflow: every main-window state at 5 text sizes x 3 window
      # sizes; fails on horizontal scroll, clipped content, elements outside
      # the window and overlapping siblings.
      - name: UI overflow audit
        run: npm run audit:overflow

      # English text is longer: the largest and the default text size.
      - name: UI overflow audit (English)
        run: npm run audit:overflow:en

      # English display: no window may still show a Japanese source string.
      - name: UI i18n audit (English)
        run: npm run audit:i18n

      # <select> option lists are drawn by the OS / WebView: every option
      # needs a readable text / background pair in light and dark schemes.
      - name: UI select contrast audit
        run: npm run audit:select

  rust:
    strategy:
      fail-fast: false
      # Matrix expands to all three platforms only when triggered via
      # workflow_dispatch with all_platforms=true. Default: Linux only.
      matrix:
        platform: ${{ fromJSON(github.event.inputs.all_platforms == 'true' && '[{"name":"linux","os":"ubuntu-latest"},{"name":"windows","os":"windows-latest"},{"name":"macos","os":"macos-14"}]' || '[{"name":"linux","os":"ubuntu-latest"}]') }}
    name: rust (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Free ~30 GiB on Ubuntu runners. Without this Cargo's debug build
      # of Tauri + wasmtime + ocrs reliably hits "no space left on device".
      - name: Free disk space (linux)
        if: matrix.platform.name == 'linux'
        run: |
          set -eux
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Linux system deps
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          # xcap 0.9's Linux backend pulls in PipeWire (Wayland portal
          # screen capture) plus GBM / Wayland / DRM for the DMABUF path.
          # Missing any one of these shows up as a linker "-l... not
          # found" deep in the test build, so keep the list explicit.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libasound2-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libdrm-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            glslc \
            spirv-headers

      # llama.cpp's Vulkan backend (Windows / Linux) builds against the
      # Vulkan SDK. Only the SDK: the runner has no GPU driver, so the
      # tests also cover starting without vulkan-1.dll.
      - name: Vulkan SDK (windows)
        if: matrix.platform.name == 'windows'
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true

      # See windows.yml: VS generator breaks the vulkan-shaders-gen install.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform.name == 'windows'
      - name: Use Ninja for CMake (windows)
        if: matrix.platform.name == 'windows'
        shell: bash
        run: |
          pip install ninja
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # llama.cpp's nested vulkan-shaders-gen build creates paths past
          # MAX_PATH under the default target dir (link.exe LNK1104 on
          # intermediate.manifest); keep the target dir short.
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugin-sdk/rust
            plugin-sdk/examples/hello-translator
            plugin-sdk/examples/music-recognizer
          key: ${{ matrix.platform.name }}
          # Only develop/main/release write the cache. PR runs restore
          # from it (base-branch caches are visible to PRs), which keeps
          # the 10 GB repo cache quota from being evicted by every PR.
          # `develop` is the base of feature PRs: without it in this
          # list they would never get a cache hit.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}

      # tauri::generate_context! embeds frontendDist (../build) at
      # compile time; an empty dir is enough for clippy/tests and saves
      # this job a full npm install + vite build.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p build

      - name: rustfmt (all crates)
        shell: bash
        run: |
          set -e
          for d in src-tauri plugin-sdk/rust plugin-sdk/examples/hello-translator plugin-sdk/examples/music-recognizer; do
            echo "::group::rustfmt $d"
            (cd "$d" && cargo fmt --all -- --check)
            echo "::endgroup::"
          done

      - name: Clippy (src-tauri)
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Clippy (plugin SDK)
        working-directory: plugin-sdk/rust
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Clippy (hello-translator)
        working-directory: plugin-sdk/examples/hello-translator
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Clippy (music-recognizer)
        working-directory: plugin-sdk/examples/music-recognizer
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Tests (src-tauri, unit + integration)
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast

      - name: Tests (plugin SDK)
        working-directory: plugin-sdk/rust
        run: cargo test --locked

      - name: Tests (hello-translator)
        working-directory: plugin-sdk/examples/hello-translator
        run: cargo test --locked

      - name: Tests (music-recognizer)
        working-directory: plugin-sdk/examples/music-recognizer
        run: cargo test --locked

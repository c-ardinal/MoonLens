name: build

# CI is Linux-only by default. macOS (×10 billing multiplier) and
# Windows (×2 multiplier, ~30 min wall-clock) eat the free-tier
# budget disproportionately, so they are reserved for:
#
#   * `release.yml` — runs on tag push, always builds all three
#     platforms because that is the installer-bundling path.
#   * This workflow's `workflow_dispatch` with `all_platforms=true`
#     — on-demand cross-platform check before cutting a release tag.
#
# Linux catches ~95% of regressions (most tests are platform-agnostic;
# xcap / cpal Linux backends compile in CI). Platform-specific bugs
# that slip through surface on the tag build; if the tag fails,
# delete the failed release and tag a patch.
#
# Concurrency cancels superseded runs on feature branches and PRs.
# `paths-ignore` skips doc-only churn.

on:
  push:
    branches: [main, release, 'claude/**', 'feature/**', 'fix/**', 'hotfix/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [main, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also run Windows + macOS (pre-tag smoke test)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

jobs:
  check:
    strategy:
      fail-fast: false
      # Matrix expands to all three platforms only when triggered via
      # workflow_dispatch with all_platforms=true. Default: Linux only.
      matrix:
        platform: ${{ fromJSON(github.event.inputs.all_platforms == 'true' && '[{"name":"linux","os":"ubuntu-latest"},{"name":"windows","os":"windows-latest"},{"name":"macos","os":"macos-14"}]' || '[{"name":"linux","os":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    steps:
      # v5 is the first release that runs on Node 24 natively, which
      # keeps CI clear of the Node 20 deprecation warnings emitted by
      # older action versions on current GitHub runners.
      - uses: actions/checkout@v5

      # Free ~30 GiB on Ubuntu runners. The base image ships with Android
      # SDK, .NET, GHC, etc. that we never use; without this Cargo's debug
      # build of Tauri + wasmtime + ocrs reliably hits "no space left on
      # device". macOS and Windows have plenty of free space already.
      - name: Free disk space (linux)
        if: matrix.platform.name == 'linux'
        run: |
          set -eux
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Linux system deps
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          # xcap 0.9's Linux backend pulls in PipeWire (Wayland portal
          # screen capture) plus GBM / Wayland / DRM for the DMABUF path.
          # Missing any one of these shows up as a linker "-l... not
          # found" miles deep in the test build, so keep the list
          # explicit.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libasound2-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libdrm-dev \
            libxkbcommon-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugin-sdk/rust
            plugin-sdk/examples/hello-translator
            plugin-sdk/examples/music-recognizer
          # Different OSes need separate caches because compiled artifacts
          # are not portable. The platform name keeps them apart.
          key: ${{ matrix.platform.name }}

      - name: Install JS deps
        run: npm ci

      - name: Typecheck frontend
        run: npm run check

      - name: Vitest (logic + DOM render tests)
        run: npm test

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy (src-tauri)
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Cargo clippy (plugin SDK)
        working-directory: plugin-sdk/rust
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Cargo clippy (hello-translator)
        working-directory: plugin-sdk/examples/hello-translator
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Cargo clippy (music-recognizer)
        working-directory: plugin-sdk/examples/music-recognizer
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Cargo unit tests
        working-directory: src-tauri
        run: cargo test --lib --no-fail-fast

      - name: Cargo integration tests
        working-directory: src-tauri
        run: cargo test --tests --no-fail-fast

      - name: Test plugin SDK
        working-directory: plugin-sdk/rust
        run: cargo test

      - name: Build + test hello-translator example
        working-directory: plugin-sdk/examples/hello-translator
        run: cargo test

      - name: Build + test music-recognizer example
        working-directory: plugin-sdk/examples/music-recognizer
        run: cargo test

[package]
name = "music-recognizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "music-recognizer"
path = "src/main.rs"

[dependencies]
moonlens-plugin-sdk = { path = "../../rust" }
anyhow = "1"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
